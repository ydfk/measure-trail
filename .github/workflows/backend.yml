name: Backend

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
      - run: gofmt -d $(find . -name '*.go' -not -path './vendor/*') | (! grep .)
      - run: go vet ./...
      - run: go test ./...
      - run: ./scripts/update-openapi.sh
      - run: git diff --exit-code -- openapi/
      - run: go build ./cmd
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
