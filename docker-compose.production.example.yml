name: measuretrail

services:
  api:
    image: ${MEASURETRAIL_IMAGE:-ydfk/measure-trail:latest}
    restart: unless-stopped
    env_file:
      - ${MEASURETRAIL_ENV_FILE:-.env.production}
    ports:
      - "${MEASURETRAIL_HOST_PORT:-21000}:21000"
    environment:
      MEASURETRAIL_API_PORT: "21000"
      MEASURETRAIL_SQLITE_PATH: /app/data/measuretrail.sqlite
      MEASURETRAIL_SQLITE_BUSY_TIMEOUT_MS: "5000"
      MEASURETRAIL_WEB_ROOT: /app/web
    volumes:
      - measuretrail-data:/app/data
      - measuretrail-log:/app/log
      - measuretrail-backups:/app/backups
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:21000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  legacy-import:
    profiles: ["tools"]
    image: ${MEASURETRAIL_IMAGE:-ydfk/measure-trail:latest}
    env_file:
      - ${MEASURETRAIL_ENV_FILE:-.env.production}
    environment:
      MEASURETRAIL_SQLITE_PATH: /app/data/measuretrail.sqlite
      MEASURETRAIL_SQLITE_BUSY_TIMEOUT_MS: "5000"
    user: "0:0"
    entrypoint: ["/app/scripts/run-legacy-import.sh"]
    volumes:
      - measuretrail-data:/app/data
      - ${MEASURETRAIL_LEGACY_IMPORT_DIR:-./import}:/import:ro

volumes:
  measuretrail-data:
  measuretrail-log:
  measuretrail-backups:
